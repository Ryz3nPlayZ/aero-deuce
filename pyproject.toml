[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aero-deuce"
version = "0.1.0"
description = "Hybrid Mamba-3 / Attention MoE language model (1.7B active / 8B total)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
